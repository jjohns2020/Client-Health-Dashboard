name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Pull Jira issues per client
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          if [ -z "$JIRA_API_TOKEN" ]; then
            echo "Jira secrets are not set. The command center will not show issues."
            exit 0
          fi
          node scripts/jira/pull.mjs
      - name: Build dashboard
        run: npm run build
        env:
          VITE_BASE: /Client-Health-Dashboard/
      - name: Confirm the built page
        run: grep -q '/Client-Health-Dashboard/assets/' dist/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site and select GitHub Actions when it has not
          # already been enabled in the repository settings.
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
